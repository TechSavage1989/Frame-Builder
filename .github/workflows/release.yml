name: Windows Release
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
    branches: ['release/**']
permissions:
  contents: write
concurrency:
  group: frame-builder-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify immutable version and release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          if ('${{ github.ref_type }}' -eq 'tag' -and "v$v" -ne '${{ github.ref_name }}') { throw 'Tag differs from package version' }
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_type }}' -eq 'branch' -and "release/$v" -ne '${{ github.ref_name }}') { throw 'Release branch differs from package version' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'main') { throw 'Run manual releases from main' }
          $old=gh release list --repo '${{ github.repository }}' --json tagName | ConvertFrom-Json
          $published=@($old | Where-Object {$_.tagName -eq "v$v"}).Count -gt 0
          if($published){
            $tagObject=gh api "repos/${{ github.repository }}/git/ref/tags/v$v" | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Unable to resolve immutable release tag'}
            while($tagObject.object.type -eq 'tag'){
              $tagObject=gh api "repos/${{ github.repository }}/git/tags/$($tagObject.object.sha)" | ConvertFrom-Json
              if($LASTEXITCODE -ne 0){throw 'Unable to resolve annotated tag'}
            }
            $releaseCommit=[string]$tagObject.object.sha
            if($tagObject.object.type -ne 'commit' -or $releaseCommit -notmatch '^[a-f0-9]{40}$'){throw 'Invalid release source commit'}
            git fetch --depth=1 origin $releaseCommit
            if($LASTEXITCODE -ne 0){throw 'Unable to fetch immutable release source'}
            git diff --exit-code $releaseCommit HEAD -- app assets browser cad_source package.json package-lock.json scripts/sync-builder.cjs Build_Windows.cmd
            if($LASTEXITCODE -ne 0){throw 'Published application differs; increment the version instead of replacing assets'}
            'EXISTING_RELEASE=true'|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "RELEASE_SOURCE_COMMIT=$releaseCommit"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }else{
            $env:GIT_TERMINAL_PROMPT='0'
            $existing=git ls-remote --tags origin "refs/tags/v$v"
            if ('${{ github.ref_type }}' -ne 'tag' -and $existing) { throw 'Tag already exists; refusing overwrite' }
            'EXISTING_RELEASE=false'|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            'RELEASE_SOURCE_COMMIT=${{ github.sha }}'|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - run: npm ci
      - run: node scripts/negative-control.cjs
      - run: npm run check
      - name: Require green Windows CI for the exact release commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $passed=$false
          for($i=0;$i -lt 100;$i++){
            $runs=gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$env:RELEASE_SOURCE_COMMIT&per_page=10" | ConvertFrom-Json
            $run=$runs.workflow_runs | Where-Object {$_.head_sha -eq $env:RELEASE_SOURCE_COMMIT} | Select-Object -First 1
            if($run -and $run.status -eq 'completed'){
              if($run.conclusion -ne 'success'){throw 'Exact source CI did not pass'}
              $passed=$true;break
            }
            Start-Sleep -Seconds 10
          }
          if(-not $passed){throw 'Timed out waiting for exact source Windows CI'}
      - run: npm run build:windows
        if: env.EXISTING_RELEASE != 'true'
      - name: Reuse immutable hosted assets for verification only
        if: env.EXISTING_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          gh release download "v$v" --repo '${{ github.repository }}' --dir dist
          if($LASTEXITCODE -ne 0){throw 'Unable to download existing immutable assets'}
      - name: Packaged visible-window and renderer-ready check
        shell: pwsh
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          ./scripts/windows-smoke.ps1 -Exe "dist/Frame_Builder_${v}_Windows_x64.exe" -ExpectedVersion $v
      - name: Prepare immutable EXE, stable-named ZIP, manifest and digests
        if: env.EXISTING_RELEASE != 'true'
        shell: pwsh
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          $env:RELEASE_TAG="v$v"
          node scripts/generate-update-manifest.cjs
          $dir='dist/portable'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "dist/Frame_Builder_${v}_Windows_x64.exe" "$dir/Frame Builder.exe"
          Copy-Item docs/QUICK_START.txt "$dir/README.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/Frame_Builder_${v}_Windows_x64.zip"
          $files=@("Frame_Builder_${v}_Windows_x64.exe","Frame_Builder_${v}_Windows_x64.zip",'update-manifest.json')
          $lines=@($files | ForEach-Object { ((Get-FileHash -LiteralPath "dist/$_" -Algorithm SHA256).Hash.ToLower())+'  '+$_ })
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'dist/SHA256SUMS.txt'),$lines,(New-Object Text.UTF8Encoding($false)))
      - name: Publish immutable pre-release
        if: env.EXISTING_RELEASE != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          $args=@('release','create',"v$v","dist/Frame_Builder_${v}_Windows_x64.exe","dist/Frame_Builder_${v}_Windows_x64.zip",
            'dist/update-manifest.json','dist/SHA256SUMS.txt','--repo','${{ github.repository }}',
            '--title',"Frame Builder $v",'--notes-file','docs/releases/RELEASE_NOTES.md','--prerelease')
          if ('${{ github.ref_type }}' -eq 'tag') {$args+='--verify-tag'} else {$args+=@('--target','${{ github.sha }}')}
          gh @args
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
      - name: Verify exact hosted tag, commit, assets and digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          $tag=gh api "repos/${{ github.repository }}/git/ref/tags/v$v" | ConvertFrom-Json
          while($tag.object.type -eq 'tag'){$tag=gh api "repos/${{ github.repository }}/git/tags/$($tag.object.sha)"|ConvertFrom-Json}
          if($tag.object.type -ne 'commit' -or $tag.object.sha -ne $env:RELEASE_SOURCE_COMMIT){throw 'Release tag differs from tested commit'}
          New-Item -ItemType Directory -Force -Path dist/hosted-check | Out-Null
          gh release download "v$v" --repo '${{ github.repository }}' --dir dist/hosted-check
          foreach($name in @("Frame_Builder_${v}_Windows_x64.exe","Frame_Builder_${v}_Windows_x64.zip",'update-manifest.json','SHA256SUMS.txt')){
            if(-not(Test-Path -LiteralPath "dist/hosted-check/$name")){throw "Missing asset: $name"}
            if((Get-FileHash "dist/$name").Hash -ne (Get-FileHash "dist/hosted-check/$name").Hash){throw "Hosted digest mismatch: $name"}
          }
          $manifest=Get-Content dist/update-manifest.json -Raw|ConvertFrom-Json
          foreach($line in Get-Content dist/SHA256SUMS.txt){
            $record=[regex]::Match($line,'^([a-f0-9]{64})  ([A-Za-z0-9_.-]+)$')
            if(-not $record.Success){throw 'Unsafe checksum entry'}
            if((Get-FileHash -LiteralPath (Join-Path 'dist' $record.Groups[2].Value) -Algorithm SHA256).Hash -ine $record.Groups[1].Value){throw 'Published checksum mismatch'}
          }
          if((Get-FileHash -LiteralPath "dist/Frame_Builder_${v}_Windows_x64.exe").Hash -ine $manifest.asset.sha256){throw 'Manifest executable hash mismatch'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) "dist/Frame_Builder_${v}_Windows_x64.zip"))
          try {
            if($archive.Entries.Count -ne 2){throw 'Unexpected portable ZIP contents'}
            foreach($entry in $archive.Entries){
              if($entry.FullName -notin @('Frame Builder.exe','README.txt')){throw 'Unsafe portable ZIP entry'}
              if($entry.FullName -eq 'Frame Builder.exe'){
                if($entry.Length -ne $manifest.asset.size){throw 'Wrong ZIP executable size'}
                $stream=$entry.Open();$hash=[Security.Cryptography.SHA256]::Create()
                try {$digest=[BitConverter]::ToString($hash.ComputeHash($stream)).Replace('-','');if($digest -ine $manifest.asset.sha256){throw 'ZIP executable differs from verified EXE'}}finally{$hash.Dispose();$stream.Dispose()}
              }elseif($entry.Length -gt 10000){throw 'Unexpected README size'}
            }
          }finally{$archive.Dispose()}
          $config=Get-Content release-validation.json | ConvertFrom-Json
          $prior=$config.previousVersion
          "BOOTSTRAP_RELEASE=$($config.bootstrap -eq $true)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREVIOUS_VERSION=$prior" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reuse passed native installer checks for identical published application
        if: env.EXISTING_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config=Get-Content release-validation.json -Raw|ConvertFrom-Json
          if($config.verifiedInstallerRun){
            $id=[long]$config.verifiedInstallerRun
            $run=gh api "repos/${{ github.repository }}/actions/runs/$id"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $run.name -ne 'Windows Release'){throw 'Invalid native validation source'}
            $jobs=gh api "repos/${{ github.repository }}/actions/runs/$id/jobs"|ConvertFrom-Json
            $passed=@($jobs.jobs.steps|Where-Object {$_.name -eq 'Real hosted download, native replacement, lock wait and rollback' -and $_.conclusion -eq 'success'}).Count -gt 0
            if(-not $passed){throw 'Referenced native installer validation did not pass'}
            git fetch --depth=1 origin $run.head_sha
            if($LASTEXITCODE -ne 0){throw 'Unable to inspect native validation source'}
            git diff --exit-code $run.head_sha HEAD -- app assets browser cad_source package.json package-lock.json scripts/sync-builder.cjs Build_Windows.cmd
            if($LASTEXITCODE -ne 0){throw 'Native installer validation application differs'}
            $prior=git show ($run.head_sha+':release-validation.json')|ConvertFrom-Json
            if($prior.previousVersion -ne $config.previousVersion){throw 'Native test previous version differs'}
            $proof=@{run_id=$id;source_commit=$run.head_sha;release_commit=$env:RELEASE_SOURCE_COMMIT;passed=$true}
            New-Item -ItemType Directory -Force validation/runtime|Out-Null
            $proof|ConvertTo-Json|Set-Content validation/runtime/reused-installer-validation.json
            'REUSE_NATIVE_INSTALLER=true'|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Real hosted download, native replacement, lock wait and rollback
        if: env.PREVIOUS_VERSION != '' && env.REUSE_NATIVE_INSTALLER != 'true'
        run: node scripts/hosted-update-integration.cjs direct
      - name: Promote only after native update and rollback pass
        if: env.PREVIOUS_VERSION != '' && env.BOOTSTRAP_RELEASE != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$v" --repo '${{ github.repository }}' --prerelease=false --latest
          if($LASTEXITCODE -ne 0){throw 'Stable promotion failed'}
      - name: Previous portable app uses real feed and native update controls
        id: actual_ui_update
        if: env.PREVIOUS_VERSION != '' && env.BOOTSTRAP_RELEASE != 'True'
        run: node scripts/hosted-update-integration.cjs ui
      - name: Keep an unsuccessful feed verification out of stable
        if: failure() && steps.actual_ui_update.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$v" --repo '${{ github.repository }}' --prerelease
      - name: Retain exact release and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Builder-Release-Validation
          path: |
            dist/Frame_Builder_*.exe
            dist/Frame_Builder_*.zip
            dist/update-manifest.json
            dist/SHA256SUMS.txt
            validation/runtime/*.json
          retention-days: 30
