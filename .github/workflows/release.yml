name: Windows Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify release version and source
        shell: pwsh
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          if ('${{ github.event_name }}' -eq 'push' -and "v$v" -ne '${{ github.ref_name }}') { throw 'Tag does not match package version' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'main') { throw 'Run manual releases from main' }
      - run: npm ci
      - run: node scripts/negative-control.cjs
      - run: node scripts/sync-builder.cjs
      - run: node --test scripts/desktop.test.cjs scripts/update.test.cjs
      - run: npm run build:windows
      - name: Native packaged-window smoke test
        shell: pwsh
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          ./scripts/windows-smoke.ps1 -Exe "dist/Frame_Builder_${v}_Windows_x64.exe" -ExpectedVersion $v
      - name: Verify portable executable metadata
        shell: pwsh
        run: |
          $exe=Get-ChildItem dist -Filter 'Frame_Builder_*_Windows_x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Missing release EXE' }
          if ($exe.VersionInfo.ProductName -notlike '*Frame Builder*') { throw 'Wrong executable identity' }
          if ($exe.Length -lt 1000000) { throw 'Unexpected executable size' }
      - name: Prepare release manifest and checksum
        shell: pwsh
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          $env:RELEASE_TAG="v$v"
          node scripts/generate-update-manifest.cjs
      - name: Publish immutable pre-release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          $exe="dist/Frame_Builder_${v}_Windows_x64.exe"
          $args=@('release','create',"v$v",$exe,'dist/update-manifest.json','dist/SHA256SUMS.txt',
            '--repo','${{ github.repository }}','--title',"Frame Builder v$v",
            '--notes','Windows portable pre-release for validation. Confirm frame exports and the complete updater workflow before promoting to a stable release.',
            '--prerelease')
          if ('${{ github.event_name }}' -eq 'push') {
            $args+='--verify-tag'
          } else {
            $existing=git ls-remote --tags origin "refs/tags/v$v"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing release tags' }
            if ($existing) { throw 'Release tag already exists; refusing to overwrite' }
            $args+=@('--target','${{ github.sha }}')
          }
          gh @args
      - name: Verify downloadable release assets and exact digest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          $name="Frame_Builder_${v}_Windows_x64.exe"
          $json=gh release view "v$v" --repo '${{ github.repository }}' --json assets,tagName,isPrerelease | ConvertFrom-Json
          if (-not $json.isPrerelease) { throw 'Initial release must remain a pre-release until native update testing' }
          $names=@($json.assets | ForEach-Object { $_.name })
          foreach($need in @($name,'update-manifest.json','SHA256SUMS.txt')) {
            if($names -notcontains $need){throw "Missing hosted asset: $need"}
          }
          New-Item -ItemType Directory -Force -Path dist/hosted-check | Out-Null
          gh release download "v$v" --repo '${{ github.repository }}' --pattern $name --dir dist/hosted-check
          $source=(Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash
          $hosted=(Get-FileHash -LiteralPath "dist/hosted-check/$name" -Algorithm SHA256).Hash
          if($source -ne $hosted){throw 'Hosted EXE digest differs from verified local artifact'}
          Write-Host "Hosted release verified: v$v / $hosted"
