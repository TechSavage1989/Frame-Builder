name: Frame Builder CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/negative-control.cjs
      - run: node --test scripts/desktop.test.cjs scripts/update.test.cjs
      - run: node scripts/sync-builder.cjs
  windows-portable:
    runs-on: windows-latest
    needs: source-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Native model, exports and production timer integration
        run: npx electron scripts/native-integration.cjs
      - run: npm run build:windows
      - name: Native packaged-window smoke test
        shell: pwsh
        run: |
          $v=(Get-Content package.json | ConvertFrom-Json).version
          ./scripts/windows-smoke.ps1 -Exe "dist/Frame_Builder_${v}_Windows_x64.exe" -ExpectedVersion $v
      - name: Keep Windows candidate for verification (not a stable release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Builder-Windows-x64-Candidate
          path: dist/Frame_Builder_*_Windows_x64.exe
          retention-days: 14
      - name: Retain validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Builder-Validation
          path: validation/runtime/*.json
          retention-days: 30
